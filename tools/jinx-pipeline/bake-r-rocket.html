<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Jinx R rocket ortho bake</title>
    <style>
      body {
        margin: 0;
        background: transparent;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from 'three'
      import { OBJLoader } from 'three/addons/loaders/OBJLoader.js'

      const params = new URLSearchParams(location.search)
      const objUrl = params.get('obj') ?? './work/jinx_r_mis.obj'
      const texUrl = params.get('tex') ?? '../../public/assets/vfx/jinx/spells/jinx_r_mis.png'
      const outW = Number(params.get('w') ?? 640)
      const outH = Number(params.get('h') ?? 256)
      const rotY = Number(params.get('rotY') ?? -2.094395102)
      const fill = Number(params.get('fill') ?? 0.88)

      const canvas = document.getElementById('c')
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
        premultipliedAlpha: false,
        preserveDrawingBuffer: true,
      })
      renderer.setPixelRatio(1)
      renderer.setSize(outW, outH, false)
      renderer.outputColorSpace = THREE.SRGBColorSpace
      renderer.setClearColor(0x000000, 0)

      const scene = new THREE.Scene()
      const aspect = outW / outH
      let half = 22
      const camera = new THREE.OrthographicCamera(
        -half * aspect,
        half * aspect,
        half,
        -half,
        0.1,
        500,
      )
      camera.position.set(0, 120, 0)
      camera.up.set(0, 0, -1)
      camera.lookAt(0, 0, 0)

      scene.add(new THREE.AmbientLight(0xffffff, 0.55))
      const key = new THREE.DirectionalLight(0xffffff, 1.15)
      key.position.set(40, 90, 30)
      scene.add(key)
      const fillL = new THREE.DirectionalLight(0xffe0cc, 0.45)
      fillL.position.set(-35, 60, -25)
      scene.add(fillL)

      const loader = new OBJLoader()
      const texLoader = new THREE.TextureLoader()

      window.__jinxRBake = { ready: false, render: () => {} }

      Promise.all([
        loader.loadAsync(objUrl),
        texLoader.loadAsync(texUrl),
      ]).then(([obj, tex]) => {
        tex.colorSpace = THREE.SRGBColorSpace
        tex.flipY = false
        const mat = new THREE.MeshStandardMaterial({
          map: tex,
          metalness: 0.15,
          roughness: 0.65,
          transparent: false,
        })
        obj.traverse((c) => {
          if (c.isMesh) {
            c.material = mat
          }
        })
        const box = new THREE.Box3().setFromObject(obj)
        const size = box.getSize(new THREE.Vector3())
        const center = box.getCenter(new THREE.Vector3())
        obj.position.sub(center)
        obj.rotation.x = -Math.PI / 2
        obj.rotation.y = rotY
        const maxDim = Math.max(size.x, size.y, size.z)
        half = (maxDim * 0.55) / fill
        camera.left = -half * aspect
        camera.right = half * aspect
        camera.top = half
        camera.bottom = -half
        camera.updateProjectionMatrix()
        scene.add(obj)
        window.__jinxRBake.render = () => {
          renderer.render(scene, camera)
        }
        window.__jinxRBake.exportPng = () => {
          window.__jinxRBake.render()
          return canvas.toDataURL('image/png')
        }
        window.__jinxRBake.ready = true
        window.__jinxRBake.render()
      })
    </script>
  </body>
</html>

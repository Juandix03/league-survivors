<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ahri mesh ortho bake</title>
    <style>
      body {
        margin: 0;
        background: transparent;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from 'three'
      import { OBJLoader } from 'three/addons/loaders/OBJLoader.js'

      const params = new URLSearchParams(location.search)
      const objUrl = params.get('obj')
      const texUrl = params.get('tex')
      const outW = Number(params.get('w') ?? 512)
      const outH = Number(params.get('h') ?? 512)
      const rotY = Number(params.get('rotY') ?? 0)
      const fill = Number(params.get('fill') ?? 0.82)
      const flipY = params.get('flipY') !== '0'

      const canvas = document.getElementById('c')
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
        premultipliedAlpha: false,
        preserveDrawingBuffer: true,
      })
      renderer.setPixelRatio(1)
      renderer.setSize(outW, outH, false)
      renderer.outputColorSpace = THREE.SRGBColorSpace
      renderer.setClearColor(0x000000, 0)

      const scene = new THREE.Scene()
      const aspect = outW / outH
      let half = 24
      const camera = new THREE.OrthographicCamera(
        -half * aspect,
        half * aspect,
        half,
        -half,
        0.1,
        500,
      )
      camera.position.set(0, 120, 0)
      camera.up.set(0, 0, -1)
      camera.lookAt(0, 0, 0)

      const loader = new OBJLoader()
      const texLoader = new THREE.TextureLoader()

      window.__ahriMeshBake = { ready: false, render: () => {} }

      Promise.all([loader.loadAsync(objUrl), texLoader.loadAsync(texUrl)])
        .then(([obj, tex]) => {
          tex.colorSpace = THREE.SRGBColorSpace
          tex.flipY = flipY
          // LoL VFX UVs are emissive masks — unlit, not MeshStandard shading.
          const mat = new THREE.MeshBasicMaterial({
            map: tex,
            transparent: true,
            depthWrite: false,
            side: THREE.DoubleSide,
          })
          obj.traverse((c) => {
            if (c.isMesh) {
              c.material = mat
              c.rotation.y = rotY
            }
          })

          const box = new THREE.Box3().setFromObject(obj)
          const size = new THREE.Vector3()
          box.getSize(size)
          const maxDim = Math.max(size.x, size.y, size.z)
          const scale = (half * 2 * fill) / maxDim
          obj.scale.setScalar(scale)
          box.setFromObject(obj)
          const center = new THREE.Vector3()
          box.getCenter(center)
          obj.position.sub(center)

          scene.add(obj)

          window.__ahriMeshBake.render = () => {
            renderer.render(scene, camera)
          }
          window.__ahriMeshBake.exportPng = () => canvas.toDataURL('image/png')
          window.__ahriMeshBake.ready = true
          window.__ahriMeshBake.render()
        })
        .catch((err) => {
          console.error('bake failed', err)
          window.__ahriMeshBake.error = String(err)
        })
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Yasuo wind wall mesh bake</title>
    <style>
      body {
        margin: 0;
        background: transparent;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from 'three'
      import { OBJLoader } from 'three/addons/loaders/OBJLoader.js'

      const params = new URLSearchParams(location.search)
      const objUrl = params.get('obj')
      const texUrl = params.get('tex')
      const sideObjUrl = params.get('sideObj')
      const outW = Number(params.get('w') ?? 512)
      const outH = Number(params.get('h') ?? 256)
      const rotY = Number(params.get('rotY') ?? Math.PI / 2)
      const fill = Number(params.get('fill') ?? 0.82)

      const canvas = document.getElementById('c')
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
        premultipliedAlpha: false,
        preserveDrawingBuffer: true,
      })
      renderer.setPixelRatio(1)
      renderer.setSize(outW, outH, false)
      renderer.outputColorSpace = THREE.SRGBColorSpace
      renderer.setClearColor(0x000000, 0)

      const scene = new THREE.Scene()
      const aspect = outW / outH
      let orthoHalf = 3.4
      const camera = new THREE.OrthographicCamera(
        -orthoHalf * aspect,
        orthoHalf * aspect,
        orthoHalf,
        -orthoHalf,
        0.05,
        200,
      )
      const CAM_DIST = 26
      const CAM_TILT = 0.42
      camera.position.set(0, Math.cos(CAM_TILT) * CAM_DIST, Math.sin(CAM_TILT) * CAM_DIST)
      camera.up.set(0, 1, 0)
      camera.lookAt(0, 1.1, 0)

      const loader = new OBJLoader()
      const texLoader = new THREE.TextureLoader()

      function prepMesh(obj, tex) {
        tex.colorSpace = THREE.SRGBColorSpace
        const mat = new THREE.MeshBasicMaterial({
          map: tex,
          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide,
        })
        obj.traverse((c) => {
          if (c.isMesh) c.material = mat
        })
        obj.rotation.y = rotY
        return obj
      }

      function fitScene(objects) {
        const box = new THREE.Box3()
        for (const o of objects) box.expandByObject(o)
        const size = new THREE.Vector3()
        box.getSize(size)
        const center = new THREE.Vector3()
        box.getCenter(center)
        const maxDim = Math.max(size.x, size.y, size.z, 0.001)
        const scale = (orthoHalf * 2 * fill) / maxDim
        for (const o of objects) {
          o.scale.setScalar(scale)
          o.position.sub(center.clone().multiplyScalar(scale))
          o.position.y += 1.05
        }
      }

      window.__yasuoWallBake = { ready: false }

      Promise.all([
        loader.loadAsync(objUrl),
        sideObjUrl ? loader.loadAsync(sideObjUrl) : Promise.resolve(null),
        texLoader.loadAsync(texUrl),
      ])
        .then(([mainObj, sideObj, tex]) => {
          const group = new THREE.Group()
          group.add(prepMesh(mainObj, tex))
          if (sideObj) group.add(prepMesh(sideObj, tex))
          fitScene([group])
          scene.add(group)
          window.__yasuoWallBake.exportPng = () => {
            renderer.render(scene, camera)
            return canvas.toDataURL('image/png')
          }
          window.__yasuoWallBake.ready = true
          renderer.render(scene, camera)
        })
        .catch((err) => {
          window.__yasuoWallBake.error = String(err)
        })
    </script>
  </body>
</html>
